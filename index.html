<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Comic Vault</title>
<style>
:root{--bg:#111827;--card:#1f2937;--line:#374151;--tx:#f3f4f6;--mu:#9ca3af;--ac:#ef4444}
@media(prefers-color-scheme:light){:root{--bg:#f3f4f6;--card:#fff;--line:#d1d5db;--tx:#111827;--mu:#6b7280}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1{font-size:1.2rem;margin:0}h2{font-size:1rem;margin:1.2rem 0 .5rem}a{color:inherit}
input,select,textarea,button,.btn{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem;width:100%;text-decoration:none;text-align:center;display:block}
button,.btn{background:var(--ac);border-color:var(--ac);color:#fff;cursor:pointer;width:auto}
button.ghost{background:transparent;color:var(--tx);border-color:var(--line)}button.link{background:none;border:0;color:var(--mu);text-decoration:underline}
button.x{padding:.2rem .6rem}.muted,small{color:var(--mu)}.pad{padding:1rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.7rem 1rem;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;flex-wrap:wrap}
.bar span{display:flex;gap:.4rem}.bar button{padding:.35rem .6rem;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem}.narrow{max-width:380px;margin:12vh auto;display:grid;gap:.7rem}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.5rem;padding:.7rem 1rem}.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem}.sum b{display:block;font-size:1.05rem}
.ctl{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:.5rem;padding:0 1rem .7rem}.ctl input{grid-column:1/-1}.ctl .btn{grid-column:auto}
.row{display:flex;justify-content:space-between;gap:.7rem;padding:.7rem 1rem;border-top:1px solid var(--line);text-decoration:none}.row div{display:grid;gap:.1rem}.row .r{text-align:right}
.tag{font-weight:600}.wrap{max-width:760px;margin:0 auto;padding:1rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.grid label{display:grid;gap:.2rem;font-size:.8rem;color:var(--mu)}.grid .full{grid-column:1/-1}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.imgs img{width:100%;border-radius:8px;border:1px solid var(--line)}.ph{aspect-ratio:2/3;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--mu)}
table{width:100%;border-collapse:collapse}td{padding:.35rem .2rem;border-top:1px solid var(--line)}td:last-child,td.n{text-align:right}.add{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.5rem}
.links{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}.links a{padding:.35rem .7rem;border:1px solid var(--line);border-radius:999px;font-size:.85rem}
#toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:#000;color:#fff;padding:.6rem 1rem;border-radius:8px;z-index:9}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))</script>
</body></html>
